<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="L.E.N.S.">
  <title>L.E.N.S. — Loss Estimator &amp; Network Solver</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/png/apple-touch-icon.png">
  <style>
    html,body{margin:0;min-height:100%;background:#080b0f;color:#edf2f6;font-family:Inter,"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,rgba(255,121,0,.12),transparent 38%),#080b0f}
    main{text-align:center;padding:24px}.brand{font-weight:950;font-size:2rem;letter-spacing:.2em}.sub{margin-top:9px;color:#8996a2;font-size:.72rem;letter-spacing:.08em}.pulse{width:34px;height:3px;margin:20px auto 0;border-radius:99px;background:#ff7900;box-shadow:0 0 16px rgba(255,121,0,.7);animation:p 1s ease-in-out infinite alternate}@keyframes p{to{opacity:.35;transform:scaleX(.6)}}
    a{color:#ff9a33}
  </style>
</head>
<body>
  <main>
    <div class="brand">L.E.N.S.</div>
    <div class="sub">LOSS ESTIMATOR &amp; NETWORK SOLVER</div>
    <div class="pulse" aria-hidden="true"></div>
    <noscript><p><a href="v5/index.html">Open L.E.N.S.</a></p></noscript>
  </main>
  <script>
    (() => {
      const target = `v5/index.html${location.search}${location.hash}`;
      let moved = false;
      const go = () => { if(!moved){ moved = true; location.replace(target); } };
      const timer = setTimeout(go, 1200);
      if('serviceWorker' in navigator){
        navigator.serviceWorker.register('./sw.js', {scope:'./'})
          .catch(() => null)
          .finally(() => { clearTimeout(timer); go(); });
      } else {
        clearTimeout(timer);
        go();
      }
    })();
  </script>
</body>
</html>
